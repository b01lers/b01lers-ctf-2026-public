name: Upload challenge metadata to rCTF on merge
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: b01lers/rctf-deploy-action@main
        with:
          rctf-url: 'https://rctf-bctf.b01lers.net/'
          rctf-token: ${{ secrets.RCTF_TOKEN }}

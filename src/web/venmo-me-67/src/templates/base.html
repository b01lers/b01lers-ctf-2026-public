<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root { --bg:#f6efe4; --panel:rgba(255,252,247,.9); --ink:#211b17; --muted:#675d4f; --line:rgba(61,46,25,.12); --brand:#b3542f; --brand2:#0c7a63; --warn:#925315; --danger:#8a3126; --radius:24px; --shadow:0 24px 60px rgba(77,47,20,.14); }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; font-family:"Avenir Next","Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(circle at top left, rgba(255,211,153,.55), transparent 26%), radial-gradient(circle at bottom right, rgba(12,122,99,.15), transparent 24%), linear-gradient(145deg, #f5eee3, #fbf7f0 55%, #efe3d2); }
      .shell { width:min(1120px, calc(100% - 32px)); margin:0 auto; padding:32px 0 56px; }
      .grid { display:grid; gap:20px; }
      .grid > * { min-width:0; }
      .hero { grid-template-columns:minmax(0, 1.1fr) minmax(0, .9fr); align-items:start; }
      .columns { grid-template-columns:minmax(0, .95fr) minmax(0, 1.05fr); }
      .panel { min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
      .pad { padding:28px; }
      .eyebrow,.pill { display:inline-flex; width:fit-content; padding:8px 12px; border-radius:999px; font-size:.78rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; background:rgba(179,84,47,.1); color:#7d3415; }
      h1 { margin:16px 0 12px; font-size:clamp(2.3rem, 5vw, 4.5rem); line-height:.96; letter-spacing:-.05em; }
      h2 { margin:0 0 16px; font-size:1.1rem; }
      p { margin:0; line-height:1.68; color:var(--muted); }
      .stats,.cards,.list,.qr-selector { display:grid; gap:12px; min-width:0; max-width:100%; }
      .stats { grid-template-columns:repeat(3, minmax(0,1fr)); }
      .cards { grid-template-columns:repeat(3, minmax(0,1fr)); margin-top:22px; }
      .card,.metric,.row,.qr-focus { min-width:0; padding:16px; border-radius:18px; background:rgba(255,255,255,.72); border:1px solid rgba(61,46,25,.08); }
      .metric span,.label { display:block; margin-bottom:6px; font-size:.82rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
      .metric strong { word-break:break-word; }
      form,.stack { display:grid; gap:14px; min-width:0; }
      label { display:grid; gap:8px; font-weight:700; }
      input[type="file"] { width:100%; padding:14px; border-radius:14px; border:1px dashed rgba(125,52,21,.3); background:white; }
      button,a.button { appearance:none; border:none; text-decoration:none; cursor:pointer; border-radius:999px; padding:13px 18px; font-weight:800; font-size:.95rem; }
      button.primary,a.button.primary { color:white; background:linear-gradient(135deg, var(--brand), #7d3415); box-shadow:0 18px 30px rgba(125,52,21,.24); }
      button.secondary,a.button.secondary { background:rgba(12,122,99,.1); color:var(--brand2); }
      button:disabled { opacity:.7; cursor:progress; }
      .badge { display:inline-flex; width:fit-content; padding:10px 14px; border-radius:999px; font-size:.78rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; background:rgba(12,122,99,.12); color:var(--brand2); }
      .badge.warning { background:rgba(146,83,21,.12); color:var(--warn); }
      .badge.error { background:rgba(138,49,38,.12); color:var(--danger); }
      .banner { display:none; padding:14px 16px; border-radius:18px; font-size:.94rem; }
      .banner.show { display:block; }
      .banner.warn { background:rgba(146,83,21,.12); color:var(--warn); border:1px solid rgba(146,83,21,.18); }
      .banner.error { background:rgba(138,49,38,.12); color:var(--danger); border:1px solid rgba(138,49,38,.18); }
      .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
      .actions { display:flex; flex-wrap:wrap; gap:12px; }
      .debtor-strip { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; max-width:100%; }
      .debtor-chip { appearance:none; border:1px solid rgba(61,46,25,.15); background:rgba(255,255,255,.86); color:var(--ink); border-radius:999px; padding:10px 14px; font-weight:700; white-space:nowrap; cursor:pointer; }
      .debtor-chip.active { border-color:rgba(125,52,21,.45); background:rgba(179,84,47,.12); color:#7d3415; }
      .qr-focus { display:grid; gap:12px; justify-items:center; width:100%; max-width:100%; overflow:hidden; }
      .qr-focus strong,.qr-focus p { width:100%; text-align:center; overflow-wrap:anywhere; }
      .qr-focus img { display:block; width:min(280px, 100%); max-width:100%; aspect-ratio:1/1; object-fit:contain; margin:0 auto; background:white; border-radius:14px; border:1px solid rgba(61,46,25,.08); padding:12px; }
      @media (max-width: 900px) { .hero,.columns,.stats,.cards { grid-template-columns:1fr; } }
    </style>
  </head>
  <body
    data-page="{{ page }}"
    data-active-token-storage-key="{{ active_token_storage_key }}"
    data-poll-interval-ms="{{ poll_interval_ms }}"
  >
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/app.js', v='20260418-1') }}"></script>
  </body>
</html>

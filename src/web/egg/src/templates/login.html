<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Egg Hatcher Arena</title>
  <style>
    :root {
      --sky-top: #fff0c9;
      --sky-bottom: #ff8e62;
      --panel: rgba(255, 250, 239, 0.9);
      --line: rgba(104, 66, 28, 0.14);
      --text: #2f2340;
      --muted: #6b5b73;
      --primary: #ff6b4a;
      --primary-deep: #d44c3c;
      --secondary-deep: #11867b;
      --shadow: 0 18px 44px rgba(89, 50, 23, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", "Gill Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.85), transparent 30%),
        radial-gradient(circle at 85% 18%, rgba(255, 209, 102, 0.7), transparent 22%),
        linear-gradient(180deg, var(--sky-top) 0%, #ffd5ab 38%, var(--sky-bottom) 100%);
      padding: 18px 14px 36px;
    }

    .shell {
      width: min(100%, 560px);
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .panel {
      position: relative;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: auto -18% -55% auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.28), transparent 68%);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--secondary-deep);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.1rem);
      line-height: 0.95;
    }

    p {
      margin: 0;
      line-height: 1.45;
    }

    .subtle {
      margin-top: 10px;
      color: var(--muted);
      max-width: 34ch;
    }

    .stack {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field span {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(92, 55, 30, 0.16);
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font: inherit;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 13px 16px;
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-deep) 100%);
    }

    .banner {
      margin-top: 16px;
      background: linear-gradient(90deg, rgba(255, 209, 102, 0.9), rgba(255, 255, 255, 0.8));
      border: 1px solid rgba(92, 55, 30, 0.12);
      color: #5f431c;
      padding: 12px 14px;
      border-radius: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <p class="eyebrow">Pocket Hatch League</p>
      <h1>Egg Hatcher Arena</h1>
      <p class="subtle">
        Spin up your own neon incubator, stock ten mystery eggs, and crack them open
        for stat-heavy pocket creatures.
      </p>
      {% if message %}
      <div class="banner">{{ message }}</div>
      {% endif %}
      <form class="stack" method="post" action="/login">
        <label class="field">
          <span>Pilot Name</span>
          <input
            type="text"
            name="username"
            maxlength="24"
            placeholder="NovaRider"
            autocomplete="nickname"
            required
          >
        </label>
        <button class="button" type="submit">Enter Hatchery</button>
      </form>
    </section>
  </main>
</body>
</html>

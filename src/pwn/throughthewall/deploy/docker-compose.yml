name: throughthewall
services:
    chall:
        container_name: throughthewall
        build:
            dockerfile: ./deploy/Dockerfile
            context: ../
        logging:
            driver: "json-file"
            options:
                max-size: "50k"
                max-file: "3"
        restart: always
        expose:
            - "7352"
        labels:
            - "traefik.enable=true"
            - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME}.rule=HostSNI(`${COMPOSE_PROJECT_NAME}.b01le.rs`)"
            - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME}.tls=true"
            - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME}.entrypoints=ncsecure"
            - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}-svc"
            - "traefik.tcp.services.${COMPOSE_PROJECT_NAME}-svc.loadbalancer.server.port=7352"
        ports:
            - "1337:7352"
        # nsjail requires elevated privileges for cgroup/namespace setup
        privileged: true

    build:
        container_name: throughthewall_build
        build:
            dockerfile: ./deploy/Dockerfile_build
            context: ../
        logging:
            driver: "json-file"
        volumes:
            - ../build_out:/build_out
